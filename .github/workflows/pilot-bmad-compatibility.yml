name: Pilot BMad compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PizzaCalc dependencies
        run: npm ci

      - name: Verify unchanged PizzaCalc baseline
        run: npm run check

      - name: Record runtime versions
        run: |
          mkdir -p pilot-results
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "head=$(git rev-parse HEAD)"
          } | tee pilot-results/runtime.txt

      - name: Probe supported BMad tools
        run: |
          npx --yes bmad-method@6.10.0 install --list-tools \
            | tee pilot-results/bmad-list-tools.txt

      - name: Install BMad headlessly for Codex
        run: |
          npx --yes bmad-method@6.10.0 install \
            --yes \
            --modules bmm \
            --tools codex \
            --set core.user_name=Gunnar \
            --set core.communication_language=German \
            --set core.document_output_language=German \
            --set core.output_folder='{project-root}/_bmad-output' \
            | tee pilot-results/bmad-install.txt

      - name: Record generated tree and repository diff
        run: |
          find _bmad .agents _bmad-output -type f 2>/dev/null | sort \
            | tee pilot-results/generated-files.txt
          git status --short | tee pilot-results/git-status.txt
          git diff --stat | tee pilot-results/git-diff-stat.txt

      - name: Verify PizzaCalc after BMad installation
        run: npm run check

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmad-installation-probe
          path: |
            pilot-results/
            _bmad/
            .agents/
            _bmad-output/
          if-no-files-found: warn
          retention-days: 7
