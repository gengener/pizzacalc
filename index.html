<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PizzaCalc – portable Pizzateigberechnungen</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        color: #2d201a;
        background: #fff8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(42rem, 100%);
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 12vw, 5rem);
        line-height: 1;
        color: #b53b20;
      }

      p {
        margin: 0.75rem 0;
        font-size: 1.1rem;
      }

      a {
        color: #8b2b18;
        font-weight: 650;
      }

      .note {
        margin-top: 2rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PizzaCalc</h1>
      <p>Der neue PizzaCalc entsteht hier.</p>
      <p>Eine portable Open-Source-Webanwendung für Pizzateigberechnungen.</p>
      <p class="note">
        Lizenziert unter MPL-2.0 ·
        <a href="https://github.com/gengener/pizzacalc">Zum GitHub-Repository</a>
      </p>
    </main>
  </body>
</html>
